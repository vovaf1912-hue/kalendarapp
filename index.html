<style>
  :root{color-scheme:dark}*{box-sizing:border-box}
  body{margin:0;background:#07090e;color:#eef3ff;font-family:Inter,Manrope,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;transition:background .2s,color .2s}
  body[data-theme="light"]{color-scheme:light;background:#f3f6fa;color:#111827}
  .glass{background:rgba(17,22,32,.78);border:1px solid rgba(255,255,255,.08);box-shadow:0 14px 40px rgba(0,0,0,.25);backdrop-filter:blur(18px)}
  body[data-theme="light"] .glass{background:rgba(255,255,255,.94);border-color:rgba(15,23,42,.10);box-shadow:0 14px 40px rgba(15,23,42,.08)}
  .neon{box-shadow:0 0 0 1px rgba(59,130,246,.24),0 0 28px rgba(37,99,235,.10)}
  .btn{transition:.18s ease;user-select:none}.btn:active{transform:scale(.97)}
  .slot{min-height:74px}.event{cursor:pointer;transition:.16s ease}.event:hover{transform:translateY(-1px);border-color:rgba(96,165,250,.45)}
  input,textarea,select,button{font-family:inherit}input,textarea,select{outline:none;background:rgba(255,255,255,.03);color:inherit}
  body[data-theme="light"] input,body[data-theme="light"] textarea,body[data-theme="light"] select{background:#fff;color:#111827;border-color:rgba(15,23,42,.12)}
  input:focus,textarea:focus,select:focus{border-color:rgba(59,130,246,.7)!important;box-shadow:0 0 0 3px rgba(59,130,246,.10)}
  .scrollbar::-webkit-scrollbar{width:7px;height:7px}.scrollbar::-webkit-scrollbar-thumb{background:#263044;border-radius:20px}
  body[data-theme="light"] .scrollbar::-webkit-scrollbar-thumb{background:#cbd5e1}
  .hide-scrollbar::-webkit-scrollbar{display:none}.hide-scrollbar{scrollbar-width:none}
  .month-head,.month-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
  .month-head{border-bottom:1px solid rgba(255,255,255,.06);background:#0b0f17}
  body[data-theme="light"] .month-head{background:#f8fafc;border-color:rgba(15,23,42,.08)}
  .month-weekday{min-width:0;padding:10px 8px;text-align:center;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b}
  .month-cell{min-width:0;min-height:116px;padding:8px;border-right:1px solid rgba(255,255,255,.05);border-bottom:1px solid rgba(255,255,255,.05);background:rgba(255,255,255,.012);transition:.16s ease}
  .month-cell:nth-child(7n){border-right:0}
  .month-cell:hover{background:rgba(59,130,246,.035)}
  .month-cell.muted{opacity:.42}
  .month-cell.today{background:rgba(59,130,246,.045)}
  .month-date{width:28px;height:28px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
  .month-cell.today .month-date{background:#fff;color:#111827;box-shadow:0 0 0 2px rgba(255,255,255,.08)}
  .month-add{opacity:0;transition:.16s ease}
  .month-cell:hover .month-add{opacity:1}
  .month-event{display:flex;align-items:center;gap:5px;width:100%;min-width:0;padding:5px 6px;border:1px solid rgba(255,255,255,.07);border-radius:8px;background:#0e141f;font-size:11px;line-height:1.15;cursor:pointer;transition:.16s ease}
  .month-event:hover{transform:translateY(-1px);border-color:rgba(96,165,250,.45)}
  .month-event-dot{width:5px;height:5px;border-radius:999px;flex:0 0 auto;background:#60a5fa}
  .month-more{font-size:10px;color:#64748b;padding:2px 4px;cursor:pointer}
  body[data-theme="light"] .month-head{color:#0f172a}
  body[data-theme="light"] .month-cell{border-color:rgba(15,23,42,.07);background:rgba(15,23,42,.012)}
  body[data-theme="light"] .month-cell:hover{background:rgba(37,99,235,.035)}
  body[data-theme="light"] .month-event{background:#fff;border-color:rgba(15,23,42,.10);color:#111827}
  body[data-theme="light"] .month-event .text-slate-500{color:#64748b!important}
  body[data-theme="light"] .month-cell.today{background:rgba(37,99,235,.04)}
  body[data-theme="light"] .month-cell.today .month-date{background:#111827;color:#fff}
  @media(max-width:767px){.month-weekday{padding:8px 2px;font-size:9px}.month-cell{min-height:88px;padding:5px}.month-date{width:25px;height:25px;font-size:11px}.month-event{padding:4px 4px;border-radius:7px;font-size:9px;gap:3px}.month-event-dot{width:4px;height:4px}.month-more{font-size:9px;padding:2px 1px}.month-add{opacity:1;font-size:12px}}
  body[data-theme="light"] .event{background:#fff!important;border-color:rgba(15,23,42,.10)!important;color:#111827}
  body[data-theme="light"] .event .text-slate-400{color:#475569!important}
  body[data-theme="light"] .event .text-slate-500{color:#64748b!important}
  /* Full light-theme contrast pass: override Tailwind's dark-theme utility colors */
  body[data-theme="light"] .text-slate-200{color:#1e293b!important}
  body[data-theme="light"] .text-slate-300{color:#334155!important}
  body[data-theme="light"] .text-slate-400{color:#475569!important}
  body[data-theme="light"] .text-slate-500{color:#526174!important}
  body[data-theme="light"] .text-slate-600{color:#475569!important}
  body[data-theme="light"] .text-blue-300{color:#1d4ed8!important}
  body[data-theme="light"] .text-blue-400{color:#1d4ed8!important}
  body[data-theme="light"] .bg-white\/\[\.03\],
  body[data-theme="light"] .bg-white\/\[\.04\],
  body[data-theme="light"] .bg-white\/\[\.05\]{background-color:#f1f5f9!important}
  body[data-theme="light"] .border-white\/10,
  body[data-theme="light"] .border-white\/5{border-color:rgba(15,23,42,.14)!important}
  body[data-theme="light"] .week-head{color:#0f172a}
  body[data-theme="light"] .week-day .text-slate-500{color:#526174!important}
  body[data-theme="light"] .week-col .text-slate-500{color:#526174!important}
  body[data-theme="light"] .week-col .text-slate-400{color:#475569!important}
  body[data-theme="light"] .week-col .text-slate-300{color:#334155!important}
  body[data-theme="light"] #statusMenu{background:#fff!important;border-color:#cbd5e1!important;box-shadow:0 12px 32px rgba(15,23,42,.18)}
  body[data-theme="light"] #statusMenu button{color:#334155!important}
  body[data-theme="light"] #statusMenu button:hover{background:#e2e8f0!important}
  body[data-theme="light"] #statusMenu button.text-blue-300{color:#1d4ed8!important}
  body[data-theme="light"] .event .text-blue-300{color:#1d4ed8!important}
  body[data-theme="light"] .event a.text-slate-300{color:#334155!important}
  body[data-theme="light"] .glass .text-slate-400{color:#475569!important}
  body[data-theme="light"] .glass .text-slate-500{color:#526174!important}
  body[data-theme="light"] .glass .border-white\/5{border-color:rgba(15,23,42,.12)!important}
  body[data-theme="light"] .glass .bg-white\/\[\.05\]{background:#f1f5f9!important}
  /* Light theme: override dark Tailwind utility colors across the entire UI */
  body[data-theme="light"] .text-slate-200{color:#1e293b!important}
  body[data-theme="light"] .text-slate-300{color:#334155!important}
  body[data-theme="light"] .text-slate-400{color:#475569!important}
  body[data-theme="light"] .text-slate-500{color:#64748b!important}
  body[data-theme="light"] .text-slate-600{color:#64748b!important}
  body[data-theme="light"] .text-white{color:#fff!important}
  body[data-theme="light"] .bg-\[\#07090e\],body[data-theme="light"] .bg-\[\#0b0f17\],body[data-theme="light"] .bg-\[\#0e141f\],body[data-theme="light"] .bg-\[\#111722\]{background:#fff!important}
  body[data-theme="light"] .bg-white\/\[\.03\],body[data-theme="light"] .bg-white\/\[\.04\],body[data-theme="light"] .bg-white\/\[\.05\]{background:#f1f5f9!important}
  body[data-theme="light"] .border-white\/5,body[data-theme="light"] .border-white\/10{border-color:#dbe2ea!important}
  body[data-theme="light"] .event .text-blue-300{color:#1d4ed8!important}
  body[data-theme="light"] .week-col .border-dashed{border-color:#cbd5e1!important}
  body[data-theme="light"] header{background:rgba(248,250,252,.94)!important;border-color:#e2e8f0!important}
  body[data-theme="light"] .text-slate-600{color:#64748b!important}
  body[data-theme="light"] .event .underline{color:#334155!important}
  body[data-theme="light"] #statusMenu{background:#fff!important;border-color:#cbd5e1!important}
  body[data-theme="light"] #statusMenu button{color:#334155!important}
  body[data-theme="light"] #statusMenu button:hover{background:#e2e8f0!important}
  body[data-theme="light"] .glass .border-t{border-color:#e2e8f0!important}
  @media(max-width:767px){.desktop-only{display:none!important}.slot{min-height:88px}}
  @media(min-width:768px){.mobile-only{display:none!important}}
</style>
</head>
<body data-theme="dark">
<div id="app" class="min-h-screen"></div>

<script>
/* =========================
   GARAGE CALENDAR CONFIG
   ========================= */
const CONFIG = {
  APP_NAME: "Garage Calendar",
  // Supabase: данные календаря хранятся в облачной базе.
  SUPABASE_URL: "https://wpxewadgwcqeqibovjae.supabase.co",
  SUPABASE_PUBLISHABLE_KEY: "sb_publishable_0t6hg4nCoDvHAfbCirrlZQ_9rNkFDc7"
};

const hasSupabase = Boolean(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_PUBLISHABLE_KEY);
const sb = hasSupabase ? supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_PUBLISHABLE_KEY) : null;

const state = {
  authReady: false,
  session: null,
  view: "month",
  date: new Date(),
  events: [],
  loading: false,
  modal: null,
  search: "",
  selectedEvent: null
};

const pad = n => String(n).padStart(2,"0");
const isoDate = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const prettyDate = d => d.toLocaleDateString("ru-RU",{weekday:"long",day:"numeric",month:"long"});
const uid = () => crypto.randomUUID ? crypto.randomUUID() : Date.now()+"-"+Math.random().toString(16).slice(2);

function esc(v=""){
  return String(v).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}
function timeToMin(t){const [h,m]=t.split(":").map(Number);return h*60+m}
function minToTime(m){return `${pad(Math.floor(m/60))}:${pad(m%60)}`}
function startOfWeek(d){const x=new Date(d); const day=(x.getDay()+6)%7; x.setDate(x.getDate()-day); x.setHours(0,0,0,0); return x}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function isToday(d){return isoDate(d)===isoDate(new Date())}

function normalizeEvent(e){
  return {
    id:e.id, date:e.date, time:String(e.time||"").slice(0,5),
    car:e.car||"", client:e.client||"", phone:e.phone||"",
    work:e.work||"", note:e.note||"", status:e.status||"planned",
    created_at:e.created_at
  };
}

function isAuthed(){ return Boolean(state.session?.user); }

function authScreen(){
  return `
  <div class="min-h-screen flex items-center justify-center p-4 bg-[#07090e]">
    <div class="glass neon w-full max-w-md rounded-3xl p-6 sm:p-8">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 rounded-2xl bg-blue-500/10 border border-blue-400/20 flex items-center justify-center text-blue-300 font-black text-xl">G</div>
        <div><div class="font-bold text-lg">${esc(CONFIG.APP_NAME)}</div><div class="text-xs text-slate-500">Закрытый календарь автосервиса</div></div>
      </div>
      <div class="mt-7">
        <div class="text-xl font-bold">Вход для сотрудников</div>
        <div class="text-sm text-slate-500 mt-1">Доступ к календарю только для авторизованных пользователей.</div>
      </div>
      <form id="authForm" class="mt-6 space-y-3">
        <label class="block"><span class="text-xs text-slate-500">Email</span><input name="email" type="email" autocomplete="username" required placeholder="master@service.ru" class="mt-1 w-full rounded-xl border border-white/10 px-3 py-3"></label>
        <label class="block"><span class="text-xs text-slate-500">Пароль</span><input name="password" type="password" autocomplete="current-password" required placeholder="••••••••" class="mt-1 w-full rounded-xl border border-white/10 px-3 py-3"></label>
        <button id="authSubmit" class="btn w-full py-3 rounded-xl bg-blue-500 hover:bg-blue-400 font-bold">Войти</button>
        <div id="authError" class="hidden text-sm text-red-300 bg-red-500/10 border border-red-400/20 rounded-xl p-3"></div>
      </form>
      <div class="mt-5 text-[11px] text-slate-600">Аккаунты сотрудников создаются владельцем в Supabase. Регистрация из приложения отключена.</div>
    </div>
  </div>`;
}

async function signIn(email,password){
  const box=document.getElementById('authError'), btn=document.getElementById('authSubmit');
  if(btn){btn.disabled=true;btn.textContent='Входим...'}
  const {data,error}=await sb.auth.signInWithPassword({email,password});
  if(error){if(box){box.textContent=authErrorText(error);box.classList.remove('hidden')} if(btn){btn.disabled=false;btn.textContent='Войти'} return;}
  state.session=data.session; state.authReady=true; render(); loadEvents();
}
function authErrorText(err){
  const m=String(err?.message||'Ошибка входа');
  if(/invalid login credentials/i.test(m)) return 'Неверный email или пароль.';
  if(/email not confirmed/i.test(m)) return 'Email сотрудника ещё не подтверждён в Supabase.';
  return m;
}
async function signOut(){ await sb.auth.signOut(); state.session=null; state.events=[]; state.modal=null; render(); }

async function loadEvents(){
  if(!isAuthed()) return;
  state.loading=true; render();
  if(hasSupabase){
    const {data,error}=await sb.from("appointments").select("*").order("date").order("time");
    if(error){console.error(error); alert("Не удалось загрузить календарь: "+error.message);}
    else state.events=data||[];
  } else {
    state.events=[];
  }
  state.loading=false; render();
}

async function saveEvent(payload){
  if(!isAuthed()) throw new Error("Требуется вход");
  if(hasSupabase){
    const {data,error}=await sb.from("appointments").insert(payload).select().single();
    if(error) throw error;
    state.events.push(data);
  }else{
    throw new Error("Supabase не настроен");
  }
}
async function updateEvent(id,payload){
  if(!isAuthed()) throw new Error("Требуется вход");
  if(hasSupabase){
    const {data,error}=await sb.from("appointments").update(payload).eq("id",id).select().single();
    if(error) throw error;
    state.events=state.events.map(e=>e.id===id?data:e);
  }else{
    throw new Error("Supabase не настроен");
  }
}
async function deleteEvent(id){
  if(!isAuthed()) throw new Error("Требуется вход");
  if(hasSupabase){
    const {error}=await sb.from("appointments").delete().eq("id",id);
    if(error) throw error;
  }
  state.events=state.events.filter(e=>e.id!==id);
}

function statusLabel(s){
  return {planned:"Запланировано",work:"В работе",ready:"Готово",cancelled:"Отменено"}[s]||"Запланировано";
}
function statusClass(s){
  return {planned:"bg-blue-500/10 text-blue-300 border-blue-400/20",work:"bg-amber-500/10 text-amber-300 border-amber-400/20",ready:"bg-emerald-500/10 text-emerald-300 border-emerald-400/20",cancelled:"bg-red-500/10 text-red-300 border-red-400/20"}[s]||"";
}

function filteredEvents(){
  const q=state.search.trim().toLowerCase();
  let arr=state.events;
  if(q) arr=arr.filter(e=>[e.car,e.client,e.phone,e.work,e.note].join(" ").toLowerCase().includes(q));
  return arr;
}

function header(){
  return `
  <header class="sticky top-0 z-30 border-b border-white/5 bg-[#07090e]/90 backdrop-blur-xl">
    <div class="max-w-7xl mx-auto px-3 sm:px-5 py-3 flex items-center gap-3">
      <div class="w-10 h-10 rounded-2xl bg-blue-500/10 border border-blue-400/20 flex items-center justify-center text-blue-300 font-black">G</div>
      <div class="min-w-0">
        <div class="font-bold tracking-tight truncate">${esc(CONFIG.APP_NAME)}</div>
        <div class="text-[11px] text-slate-500">${hasSupabase?"Общий облачный календарь":"ДЕМО • локальные данные"}</div>
      </div>
      <div class="ml-auto flex items-center gap-2">
        <div class="hidden sm:block relative">
          <input id="search" value="${esc(state.search)}" placeholder="Поиск машины или клиента"
            class="w-64 bg-white/[.03] border border-white/10 rounded-xl px-3 py-2 text-sm">
        </div>
        <button class="btn px-3 py-2 rounded-xl bg-white/[.04] border border-white/10 text-sm" onclick="openSettings()">⚙</button>
        <button class="btn px-3 py-2 rounded-xl bg-white/[.04] border border-white/10 text-sm" onclick="signOut()">Выйти</button>
        <button class="btn px-3 py-2 rounded-xl bg-blue-500 hover:bg-blue-400 text-white font-semibold text-sm" onclick="openNew()">+ Запись</button>
      </div>
    </div>
    <div class="sm:hidden px-3 pb-3">
      <input id="searchMobile" value="${esc(state.search)}" placeholder="Поиск машины, клиента, телефона..."
        class="w-full bg-white/[.03] border border-white/10 rounded-xl px-3 py-2.5 text-sm">
    </div>
  </header>`;
}

function render(){
  if(!state.authReady || !isAuthed()){ document.getElementById("app").innerHTML=authScreen(); bindAuth(); return; }
  const d=state.date;
  const monthEvents=filteredEvents().filter(e=>e.date>=monthGridStart(d) && e.date<=monthGridEnd(d)).length;
  document.getElementById("app").innerHTML=`
    ${header()}
    <main class="max-w-7xl mx-auto p-2 sm:p-5">
      <section class="glass neon rounded-2xl overflow-hidden">
        <div class="p-3 sm:p-4 border-b border-white/5 flex items-center gap-2">
          <button class="btn w-10 h-10 rounded-xl bg-white/[.05] border border-white/10 text-lg" onclick="moveDate(-1)" aria-label="Предыдущий месяц">←</button>
          <button class="btn px-3 py-2 rounded-xl bg-white/[.05] border border-white/10 text-sm" onclick="goToday()">Сегодня</button>
          <button class="btn w-10 h-10 rounded-xl bg-white/[.05] border border-white/10 text-lg" onclick="moveDate(1)" aria-label="Следующий месяц">→</button>
          <button class="ml-1 sm:ml-2 text-left group" onclick="goToday()">
            <div class="font-bold text-lg sm:text-xl capitalize group-hover:text-blue-300 transition">${esc(d.toLocaleDateString("ru-RU",{month:"long",year:"numeric"}))}</div>
            <div class="text-[11px] text-slate-500">${monthEvents} ${plural(monthEvents,"запись","записи","записей")} в календаре</div>
          </button>
          <div class="ml-auto hidden sm:flex items-center gap-2">
            <div class="px-3 py-2 rounded-xl bg-blue-500/10 border border-blue-400/20 text-xs text-blue-300">Месяц</div>
          </div>
        </div>
        <div id="calendarContent">${state.loading?`<div class="p-10 text-center text-slate-500">Загрузка...</div>`:monthView(d)}</div>
      </section>
      <div class="mt-3 text-center text-xs text-slate-600">${hasSupabase?"Данные синхронизируются через Supabase":"Supabase не настроен"}</div>
    </main>
    ${state.modal==="event"?eventModal():state.modal==="settings"?settingsModal():""}
  `;
  bindSearch();
}

function bindAuth(){
  const form=document.getElementById("authForm");
  if(form) form.addEventListener("submit",e=>{e.preventDefault();const fd=new FormData(form);signIn(String(fd.get("email")||"").trim(),String(fd.get("password")||""));});
}

function bindSearch(){
  for(const id of ["search","searchMobile"]){
    const el=document.getElementById(id);
    if(el) el.addEventListener("input",e=>{
      state.search=e.target.value;
      const box=document.getElementById("calendarContent");
      if(box) box.innerHTML=state.view==="day"?dayView(state.date):monthView(state.date);
    });
  }
}

function plural(n,a,b,c){
  n=Math.abs(n)%100; const n1=n%10;
  if(n>10&&n<20)return c; if(n1>1&&n1<5)return b; if(n1===1)return a; return c;
}
function monthGridStart(d){
  const first=new Date(d.getFullYear(),d.getMonth(),1);
  return addDays(first,-((first.getDay()+6)%7));
}
function monthGridEnd(d){
  const last=new Date(d.getFullYear(),d.getMonth()+1,0);
  return addDays(last,6-((last.getDay()+6)%7));
}
function moveMonth(n){
  state.date=new Date(state.date.getFullYear(),state.date.getMonth()+n,1);
  render();
}
function monthView(d){
  const start=monthGridStart(d), days=Array.from({length:42},(_,i)=>addDays(start,i));
  const labels=["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];
  return `<div class="overflow-hidden">
    <div class="month-head">${labels.map(x=>`<div class="month-weekday">${x}</div>`).join("")}</div>
    <div class="month-grid">${days.map(day=>{
      const ds=isoDate(day), inMonth=day.getMonth()===d.getMonth(), today=isToday(day);
      const ev=filteredEvents().filter(e=>e.date===ds).sort((a,b)=>timeToMin(a.time)-timeToMin(b.time));
      const shown=ev.slice(0,3), extra=ev.length-3;
      return `<div class="month-cell ${inMonth?"":"muted"} ${today?"today":""}" onclick="openDay('${ds}')">
        <div class="flex items-center justify-between gap-1 mb-1">
          <div class="month-date">${day.getDate()}</div>
          <button class="month-add text-slate-500 hover:text-blue-300" onclick="event.stopPropagation();openNew('${ds}','10:00')" aria-label="Добавить запись">＋</button>
        </div>
        <div class="space-y-1">${shown.map(monthEvent).join("")}
          ${extra>0?`<div class="month-more" onclick="event.stopPropagation();openDay('${ds}')">+ ещё ${extra}</div>`:""}
        </div>
      </div>`;
    }).join("")}</div>
  </div>`;
}
function openDay(ds){
  state.date=new Date(ds+"T12:00:00");
  state.view="day";
  renderDayView();
}
function renderDayView(){
  const d=state.date;
  document.getElementById("app").innerHTML=`${header()}
    <main class="max-w-7xl mx-auto p-3 sm:p-5">
      <section class="glass neon rounded-2xl overflow-hidden">
        <div class="p-3 sm:p-4 border-b border-white/5 flex items-center gap-2">
          <button class="btn px-3 py-2 rounded-xl bg-white/[.05] border border-white/10" onclick="backToMonth()">← Месяц</button>
          <div class="ml-1"><div class="font-bold capitalize">${esc(prettyDate(d))}</div><div class="text-xs text-slate-500">${filteredEvents().filter(e=>e.date===isoDate(d)).length} записей</div></div>
          <button class="ml-auto btn px-3 py-2 rounded-xl bg-blue-500 hover:bg-blue-400 text-white font-semibold text-sm" onclick="openNew('${isoDate(d)}','10:00')">+ Запись</button>
        </div>
        <div id="calendarContent">${state.loading?`<div class="p-10 text-center text-slate-500">Загрузка...</div>`:dayView(d)}</div>
      </section>
    </main>
    ${state.modal==="event"?eventModal():state.modal==="settings"?settingsModal():""}`;
  bindSearch();
}
function backToMonth(){state.view="month";render()}
function dayView(d){
  const date=isoDate(d), events=filteredEvents().filter(e=>e.date===date);
  const start=8*60,end=20*60,step=60;
  let html=`<div class="divide-y divide-white/5">`;
  for(let m=start;m<end;m+=step){
    const next=m+step, t=minToTime(m);
    const at=events.filter(e=>{const em=timeToMin(e.time||"00:00"); return em>=m && em<next;}).sort((a,b)=>timeToMin(a.time)-timeToMin(b.time));
    html+=`<div class="grid grid-cols-[58px_1fr] sm:grid-cols-[80px_1fr] min-h-[86px]">
      <div class="p-3 text-xs text-slate-500">${t}</div>
      <div class="slot p-2 border-l border-white/5" onclick="openNew('${date}','${t}')">${at.map(eventCard).join("")}</div>
    </div>`;
  }
  const late=events.filter(e=>timeToMin(e.time||"00:00")>=end).sort((a,b)=>timeToMin(a.time)-timeToMin(b.time));
  if(late.length) html+=`<div class="grid grid-cols-[58px_1fr] sm:grid-cols-[80px_1fr] min-h-[86px]"><div class="p-3 text-xs text-slate-500">${minToTime(end)}</div><div class="slot p-2 border-l border-white/5">${late.map(eventCard).join("")}</div></div>`;
  return html+"</div>";
}
function monthEvent(e){
  const dot=e.status==="ready"?"#34d399":e.status==="work"?"#fbbf24":e.status==="cancelled"?"#f87171":"#60a5fa";
  return `<div class="month-event" onclick="event.stopPropagation();openEdit('${e.id}')" title="${esc(`${e.time} · ${e.car||"Без машины"}${e.work?" · "+e.work:""}`)}">
    <span class="month-event-dot" style="background:${dot}"></span>
    <span class="text-slate-500 shrink-0">${esc(e.time)}</span>
    <span class="font-semibold truncate">${esc(e.car||"Без машины")}</span>
  </div>`;
}

function eventCard(e){
  return `<div class="event rounded-xl border border-white/10 bg-[#0e141f] p-3 mb-2" onclick="event.stopPropagation();openEdit('${e.id}')">
    <div class="flex items-start justify-between gap-2">
      <div class="font-bold text-sm">${esc(e.car||"Без машины")}</div>
      <span class="text-[10px] px-2 py-1 rounded-full border ${statusClass(e.status)}">${esc(statusLabel(e.status))}</span>
    </div>
    <div class="text-blue-300 text-sm mt-1">${esc(e.time)} · ${esc(e.work||"Работа не указана")}</div>
    ${e.client?`<div class="text-xs text-slate-400 mt-2">${esc(e.client)}${e.phone?` · <a class="text-slate-300 underline" href="tel:${esc(e.phone)}" onclick="event.stopPropagation()">${esc(e.phone)}</a>`:""}</div>`:""}
    ${e.note?`<div class="text-xs text-slate-500 mt-1 truncate">${esc(e.note)}</div>`:""}
  </div>`;
}

function eventModal(){
  const e=state.selectedEvent||{};
  const isEdit=Boolean(e.id);
  return `<div class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4" onclick="if(event.target===this)closeModal()">
    <div class="glass w-full sm:max-w-lg rounded-t-3xl sm:rounded-3xl max-h-[94vh] overflow-auto">
      <div class="p-4 border-b border-white/5 flex items-center">
        <div class="font-bold">${isEdit?"Редактировать запись":"Новая запись"}</div>
        <button class="ml-auto text-slate-400 text-xl" onclick="closeModal()">×</button>
      </div>
      <form id="eventForm" class="p-4 space-y-3">
        <div class="grid grid-cols-2 gap-3">
          <label class="block"><span class="text-xs text-slate-500">Дата</span><input name="date" type="date" required value="${esc(e.date||isoDate(state.date))}" class="mt-1 w-full rounded-xl bg-white/[.03] border border-white/10 px-3 py-3"></label>
          <label class="block"><span class="text-xs text-slate-500">Время</span><input name="time" type="time" required value="${esc(e.time||"10:00")}" class="mt-1 w-full rounded-xl bg-white/[.03] border border-white/10 px-3 py-3"></label>
        </div>
        <label class="block"><span class="text-xs text-slate-500">Автомобиль *</span><input name="car" required placeholder="BMW F30" value="${esc(e.car||"")}" class="mt-1 w-full rounded-xl bg-white/[.03] border border-white/10 px-3 py-3"></label>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <label class="block"><span class="text-xs text-slate-500">Клиент</span><input name="client" placeholder="Имя" value="${esc(e.client||"")}" class="mt-1 w-full rounded-xl bg-white/[.03] border border-white/10 px-3 py-3"></label>
          <label class="block"><span class="text-xs text-slate-500">Телефон</span><input name="phone" type="tel" placeholder="+7 900 000-00-00" value="${esc(e.phone||"+7 ")}" class="mt-1 w-full rounded-xl bg-white/[.03] border border-white/10 px-3 py-3"></label>
        </div>
        <label class="block"><span class="text-xs text-slate-500">Работа</span><input name="work" placeholder="Диагностика, ТО..." value="${esc(e.work||"")}" class="mt-1 w-full rounded-xl bg-white/[.03] border border-white/10 px-3 py-3"></label>
        <label class="block"><span class="text-xs text-slate-500">Комментарий</span><textarea name="note" rows="3" placeholder="Дополнительная информация" class="mt-1 w-full rounded-xl bg-white/[.03] border border-white/10 px-3 py-3">${esc(e.note||"")}</textarea></label>
        <label class="block"><span class="text-xs text-slate-500">Статус</span>
          <div class="relative mt-1" id="statusSelect">
            <input type="hidden" name="status" value="${esc(e.status||"planned")}">
            <button type="button" class="w-full flex items-center justify-between rounded-xl bg-[#111722] border border-white/10 px-3 py-3 text-left text-sm" onclick="toggleStatusMenu()"><span id="statusLabel">${esc(statusLabel(e.status||"planned"))}</span><span class="text-slate-400">⌄</span></button>
            <div id="statusMenu" class="hidden absolute left-0 right-0 bottom-full mb-2 z-10 rounded-xl overflow-hidden bg-[#111722] border border-white/10 shadow-2xl">
              ${["planned","work","ready","cancelled"].map(s=>`<button type="button" class="w-full px-3 py-3 text-left text-sm hover:bg-white/10 ${e.status===s||(!e.status&&s==="planned")?"text-blue-300":"text-slate-200"}" onclick="chooseStatus('${s}')">${statusLabel(s)}</button>`).join("")}
            </div>
          </div>
        </label>
        <div class="flex gap-2 pt-2">
          ${isEdit?`<button type="button" class="btn px-4 py-3 rounded-xl border border-red-400/20 text-red-300 bg-red-500/5" onclick="removeCurrent()">Удалить</button>`:""}
          <button type="submit" class="btn flex-1 py-3 rounded-xl bg-blue-500 hover:bg-blue-400 font-bold">${isEdit?"Сохранить":"Добавить запись"}</button>
        </div>
      </form>
    </div>
  </div>`;
}

function settingsModal(){
  const current=document.body.dataset.theme||"dark";
  return `<div class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-end sm:items-center justify-center p-4" onclick="if(event.target===this)closeModal()">
    <div class="glass w-full max-w-md rounded-3xl p-5">
      <div class="flex items-center"><div class="font-bold">Настройки</div><button class="ml-auto text-xl text-slate-400" onclick="closeModal()">×</button></div>
      <div class="mt-5"><div class="text-xs text-slate-500 mb-2">Тема</div><div class="grid grid-cols-2 gap-2">
        <button class="btn py-3 rounded-xl border ${current==='dark'?'border-blue-400/60 bg-blue-500/10':'border-white/10'}" onclick="setTheme('dark')">🌙 Тёмная</button>
        <button class="btn py-3 rounded-xl border ${current==='light'?'border-blue-400/60 bg-blue-500/10':'border-white/10'}" onclick="setTheme('light')">☀️ Светлая</button>
      </div></div>
      <div class="mt-5 pt-4 border-t border-white/5 text-sm text-slate-400"><b>Сотрудник:</b> ${esc(state.session?.user?.email||"")}<br><b>Синхронизация:</b> ${hasSupabase?'Общий облачный календарь':'Демо / локальные данные'}</div>
      <button class="btn mt-5 w-full py-3 rounded-xl bg-white/[.05] border border-white/10" onclick="closeModal()">Закрыть</button>
    </div></div>`;
}
function setTheme(theme){document.body.dataset.theme=theme;localStorage.setItem('garage_calendar_theme',theme);state.modal='settings';render();}

function toggleStatusMenu(){document.getElementById("statusMenu")?.classList.toggle("hidden");}
function chooseStatus(s){const i=document.querySelector('input[name="status"]'); const l=document.getElementById("statusLabel"); if(i)i.value=s; if(l)l.textContent=statusLabel(s); document.getElementById("statusMenu")?.classList.add("hidden");}
function openNew(date=isoDate(state.date),time="10:00"){state.selectedEvent={date,time,status:"planned"};state.modal="event";render()}
function openEdit(id){state.selectedEvent=state.events.find(e=>e.id===id);state.modal="event";render()}
function openSettings(){state.modal="settings";render()}
function closeModal(){state.modal=null;state.selectedEvent=null;render()}
function setView(v){state.view=v;render()}
function goToday(){state.date=new Date();state.view="month";render()}
function moveDate(n){if(state.view==="day"){state.date=addDays(state.date,n);renderDayView();}else{moveMonth(n)}}

document.addEventListener("submit",async e=>{
  if(e.target.id!=="eventForm")return;
  e.preventDefault();
  const fd=new FormData(e.target), payload=Object.fromEntries(fd.entries());
  try{
    if(state.selectedEvent?.id) await updateEvent(state.selectedEvent.id,payload);
    else await saveEvent(payload);
    closeModal();
    render();
  }catch(err){alert("Ошибка сохранения: "+err.message)}
});

async function removeCurrent(){
  if(!state.selectedEvent?.id || !confirm("Удалить запись?"))return;
  try{await deleteEvent(state.selectedEvent.id);closeModal();render()}catch(err){alert("Ошибка удаления: "+err.message)}
}

document.body.dataset.theme=localStorage.getItem("garage_calendar_theme")||"dark";
if ('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.warn));

async function boot(){
  if(!hasSupabase){ state.authReady=true; render(); return; }
  const {data}=await sb.auth.getSession();
  state.session=data.session;
  state.authReady=true;
  render();
  if(state.session){
    sb.auth.onAuthStateChange((_event,session)=>{
      state.session=session;
      if(!session){ state.events=[]; render(); }
    });
    sb.channel("appointments-live")
      .on("postgres_changes",{event:"*",schema:"public",table:"appointments"},()=>loadEvents())
      .subscribe();
    await loadEvents();
  }
}
boot();
</script>
</body>
</html>
